name: Validate investigation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce a smaller workload without replacing published measurements
        run: python scripts/benchmark.py --rows 12000 --repetitions 7 --warmups 2 --output results-ci
      - name: Render the committed measurements
        run: python scripts/render_report.py
